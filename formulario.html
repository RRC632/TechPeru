<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechPeru - Formulario de Contacto</title>
    <link rel="stylesheet" href="css/formulario.css"> <!-- O el nombre de tu archivo CSS -->
</head>
<body>

    <!-- CABECERA CON BOTÓN DE IDIOMAS -->
    <header class="main-header">
        <div class="header-wrap">
            <div class="brand">
    <!-- El enlace envuelve al título y al subtítulo -->
                    <a href="index.html" class="brand-link">
                <span class="brand-title">TechPeru</span>
                <span class="brand-title-top" class="lang-text" data-es="Formulario Oficial" data-en="Official Form">Formulario Oficial</span>
                    </a>
            </div>
            <div class="utility-buttons">
                <a href="index.html" class="btn-utility lang-text" data-es="🌐 Volver al Inicio" data-en="🌐 Back to Home">🌐 Volver al Inicio</a>
                
                <!-- Menú desplegable de Idiomas -->
                <div class="lang-dropdown">
                    <button id="langBtn" class="btn-utility">🌐 Idioma / Language</button>
                    <div id="langPanel" class="lang-panel">
                        <a href="#" class="lang-option" data-lang="es">Español</a>
                        <a href="#" class="lang-option" data-lang="en">English</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- TARJETA DEL FORMULARIO -->
    <div class="form-container">
        <div class="form-banner-header">
            <h2 class="lang-text" data-es="Registro de Datos Personales" data-en="Personal Data Registration">Registro de Datos Personales</h2>
            <p class="lang-text" data-es="Precisión hoy, tecnología mañana" data-en="Precision today, technology tomorrow">Precisión hoy, tecnología mañana</p>
        </div>

        <form id="techperu-form">
            <fieldset>
                <!-- DNI -->
                <div class="form-group">
                    <label for="idPersona">
                        <span class="lang-text" data-es="DNI Personal:" data-en="Personal ID (DNI):">DNI Personal:</span>
                    </label>
                    <input type="text" id="idPersona" name="idPersona" data-placeholder-es="Ingrese su DNI" data-placeholder-en="Enter your ID number" placeholder="Ingrese su DNI">
                </div>

                <!-- Nombre -->
                <div class="form-group">
                    <label for="nombre">
                        <span class="lang-text" data-es="Nombre:" data-en="First Name:">Nombre:</span> <span class="required-mark">*</span>
                    </label>
                    <input type="text" id="nombre" name="nombre" required data-placeholder-es="Su nombre" data-placeholder-en="Your first name" placeholder="Su nombre">
                </div>

                <!-- Apellido -->
                <div class="form-group">
                    <label for="apellido">
                        <span class="lang-text" data-es="Apellido:" data-en="Last Name:">Apellido:</span> <span class="required-mark">*</span>
                    </label>
                    <input type="text" id="apellido" name="apellido" required data-placeholder-es="Su apellido" data-placeholder-en="Your last name" placeholder="Su apellido">
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">
                        <span class="lang-text" data-es="Email:" data-en="Email Address:">Email:</span>
                    </label>
                    <input type="email" id="email" name="email" data-placeholder-es="ejemplo@correo.com" data-placeholder-en="example@mail.com" placeholder="ejemplo@correo.com">
                </div>

                <!-- Edad -->
                <div class="form-group">
                    <label for="edad">
                        <span class="lang-text" data-es="Edad:" data-en="Age:">Edad:</span>
                    </label>
                    <input type="number" id="edad" name="edad" data-placeholder-es="Su edad" data-placeholder-en="Your age" placeholder="Su edad">
                </div>

                <!-- Género -->
                <div class="form-group">
                    <label class="lang-text" data-es="Género" data-en="Gender">Género</label>
                    <div class="options-grid">
                        <label class="inline-option">
                            <input type="radio" name="genero" value="femenino">
                            <span class="lang-text" data-es="Femenino" data-en="Female">Femenino</span>
                        </label>
                        <label class="inline-option">
                            <input type="radio" name="genero" value="masculino">
                            <span class="lang-text" data-es="Masculino" data-en="Male">Masculino</span>
                        </label>
                    </div>
                </div>

                <!-- Departamento -->
                <div class="location-box form-group">
                    <label for="dep" class="lang-text" data-es="¿De qué lugar eres? (Departamento)" data-en="Where are you from? (State/Department)">¿De qué lugar eres? (Departamento)</label>
                    <select id="dep" name="departamento">
                        <option value="" class="lang-text" data-es="Selecciona tu departamento" data-en="Select your department">Selecciona tu departamento</option>
                        <option value="Lima">Lima</option>
                        <option value="Arequipa">Arequipa</option>
                        <option value="Cusco">Cusco</option>
                        <!-- Agrega los demás departamentos que tenías aquí -->
                    </select>
                </div>

                <!-- Origen de conocimiento -->
                <div class="form-group">
                    <label class="lang-text" data-es="¿Cómo nos conoces?" data-en="How did you hear about us?">¿Cómo nos conoces?</label>
                    <div class="options-grid">
                        <label class="inline-option"><input type="checkbox" name="origen" value="youtube"> YouTube</label>
                        <label class="inline-option"><input type="checkbox" name="origen" value="telegram"> Telegram</label>
                        <label class="inline-option"><input type="checkbox" name="origen" value="instagram"> Instagram</label>
                        <label class="inline-option"><input type="checkbox" name="origen" value="twitter"> X (Twitter)</label>
                        <label class="inline-option">
                            <input type="checkbox" name="origen" value="otros"> 
                            <span class="lang-text" data-es="Otros" data-en="Others">Otros</span>
                        </label>
                    </div>
                </div>

                <!-- Comentario -->
                <div class="form-group">
                    <label for="comentario" class="lang-text" data-es="Comentario:" data-en="Comment:">Comentario:</label>
                    <textarea id="comentario" name="comentario" rows="4" data-placeholder-es="Escribe algo..." data-placeholder-en="Write something..." placeholder="Escribe algo..."></textarea>
                </div>

                <!-- Botones de Acción -->
                <div class="form-actions">
                    <input type="submit" class="btn-submit-main lang-text" data-es="Enviar" data-en="Submit" value="Enviar">
                    <input type="submit" formnovalidate class="btn-submit-fast lang-text" data-es="Enviar sin validar" data-en="Submit without validation" value="Enviar sin validar">
                    <input type="reset" class="btn-reset-form lang-text" data-es="Restablecer" data-en="Reset" value="Restablecer">
                </div>
            </fieldset>
        </form>
    </div>

    <script src="js/formulario.js"></script>
</body>
</html>
