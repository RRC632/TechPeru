<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechPeru - Formulario de Contacto</title>
  <!-- Conexión con el archivo CSS externo -->
  <link rel="stylesheet" href="css/formulario.css">
</head>
<body>

  <!-- Encabezado corporativo TechPeru -->
  <header class="main-header">
    <div class="header-wrap">
      <div class="brand">
        <span class="brand-title">TechPeru</span>
        <span class="brand-title-top">Formulario Oficial</span>
      </div>
      <div class="utility-buttons">
        <a href="index.html">🌐 Volver al Inicio</a>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal Estilizado -->
  <main class="form-container">
    <div class="form-banner-header">
      <h2>Registro de Datos Personales</h2>
      <p>Precisión hoy, tecnología mañana</p>
    </div>

    <form action="mi_servidor" id="techperu-form">
      <fieldset>
        
        <!-- Campo Oculto original -->
        <input type="hidden" id="sistema" name="sistema" value="SAP"/>

        <!-- DNI -->
        <div class="form-group">
          <label for="idPersona">DNI Personal:</label>
          <input type="text" id="idPersona" name="idPersona" placeholder="Escribe tu DNI" maxlength="8">
        </div>

        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre: <span class="required-mark">*</span></label>
          <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label for="apellido">Apellido: <span class="required-mark">*</span></label>
          <input type="text" id="apellido" name="apellido" placeholder="Escribe tu apellido" required>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Escribe tu email">
        </div>

        <!-- Edad -->
        <div class="form-group">
          <label for="edad">Edad:</label>
          <input type="number" id="edad" name="edad" placeholder="Escribe tu edad" min="0">
        </div>

        <!-- Género -->
        <div class="form-group">
          <label>Género</label>
          <div class="options-grid">
            <label class="inline-option" for="femenino">
              <input type="radio" id="femenino" name="genero" value="femenino"/> Femenino
            </label>
            <label class="inline-option" for="masculino">
              <input type="radio" id="masculino" name="genero" value="masculino"/> Masculino
            </label>
          </div>
        </div>

        <!-- Lugar de residencia -->
        <div class="location-box">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="Residencia">¿De qué lugar eres? (Departamento)</label>
            <select id="Residencia" name="Residencia">
              <option value="Selecciona" selected disabled>Selecciona tu departamento</option>
              <option value="Amazonas">Amazonas</option>
              <option value="Áncash">Áncash</option>
              <option value="Apurímac">Apurímac</option>
              <option value="Arequipa">Arequipa</option>
              <option value="Ayacucho">Ayacucho</option>
              <option value="Cajamarca">Cajamarca</option>
              <option value="Cusco">Cusco</option>
              <option value="Huancavelica">Huancavelica</option>
              <option value="Huánuco">Huánuco</option>
              <option value="Ica">Ica</option>
              <option value="Junín">Junín</option>
              <option value="La Libertad">La Libertad</option>
              <option value="Lambayeque">Lambayeque</option>
              <option value="Lima">Lima</option>
              <option value="Loreto">Loreto</option>
              <option value="Madre de Dios">Madre de Dios</option>
              <option value="Moquegua">Moquegua</option>
              <option value="Pasco">Pasco</option>
              <option value="Piura">Piura</option>
              <option value="Puno">Puno</option>
              <option value="San Martín">San Martín</option>
              <option value="Tacna">Tacna</option>
              <option value="Tumbes">Tumbes</option>
              <option value="Ucayali">Ucayali</option>
            </select>
          </div>
        </div>

        <!-- Redes Sociales -->
        <div class="form-group">
          <label>¿Cómo nos conoces?</label>
          <div class="options-grid">
            <label class="inline-option" for="YouTube">
              <input type="checkbox" id="YouTube" name="Redes Sociales" value="YouTube"/> YouTube
            </label>
            <label class="inline-option" for="Telegram">
              <input type="checkbox" id="Telegram" name="Redes Sociales" value="Telegram"/> Telegram
            </label>
            <label class="inline-option" for="Instagram">
              <input type="checkbox" id="Instagram" name="Redes Sociales" value="Instagram"/> Instagram
            </label>
            <label class="inline-option" for="X (Twitter)">
              <input type="checkbox" id="X (Twitter)" name="Redes Sociales" value="X (Twitter)"/> X (Twitter)
            </label>
            <label class="inline-option" for="Otros">
              <input type="checkbox" id="Otros" name="Redes Sociales" value="Otros"/> Otros
            </label>
          </div>
        </div>

        <!-- Comentario -->
        <div class="form-group">
          <label for="comentario">Comentario:</label>
          <textarea id="comentario" name="comentario" rows="3" placeholder="Coméntanos más sobre tus requerimientos..."></textarea>
        </div>

        <!-- Botonera -->
        <div class="form-actions">
          <input type="submit" value="Enviar" class="btn-submit-main">
          <input type="submit" formnovalidate="formnovalidate" value="Enviar sin validar" class="btn-submit-fast">
          <input type="reset" value="Restablecer" class="btn-reset-form">
        </div>

      </fieldset> 
    </form>
  </main>

  <!-- Conexión con el archivo JavaScript externo -->
  <script src="js/formulario.js"></script>
</body>
</html>
