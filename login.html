<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechPeru - Login</title>
    <link rel="stylesheet" href="css/login.css"> <!-- O el nombre de tu archivo CSS -->

    <!-- Librería oficial de Supabase JS Client vía CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- CABECERA CON BOTÓN DE IDIOMAS -->
    <header class="main-header">
        <div class="header-wrap">
            <div class="brand">
                <!-- El enlace envuelve al título y al subtítulo -->
                <a href="index.html" class="brand-link">
                    <span class="brand-title">TechPeru</span>
                    <span class="brand-title-top lang-text" data-es="Login" data-en="Login Panel">Login</span>
                </a>
            </div>
            <div class="utility-buttons">
                <a href="index.html" class="btn-utility lang-text" data-es="🌐Volver al inicio" data-en="🌐Back to Home">🌐Volver al inicio</a>
                
                <!-- Menú desplegable de Idiomas -->
                <div class="lang-dropdown">
                    <button id="langBtn" class="btn-utility">🌐 Idioma / Language</button>
                    <div id="langPanel" class="lang-panel">
                        <a href="#" class="lang-option" data-lang="es">Español</a>
                        <a href="#" class="lang-option" data-lang="en">English</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- CUERPO DE INICIAR SESIÓN -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h2 class="lang-text" data-es="Iniciar Sesión" data-en="Sign In">Iniciar Sesión</h2>
            </div>
            <div class="login-content">
                <form id="loginForm">
                    <!-- Usuario -->
                    <div class="form-group">
                        <label for="user" class="lang-text" data-es="Correo:" data-en="Email:">Correo:</label>
                        <input type="text" id="user" required data-placeholder-es="Ingrese correo" data-placeholder-en="Enter email" placeholder="Ingrese correo">
                    </div>
                    
                    <!-- Contraseña -->
                    <div class="form-group">
                        <label for="pass" class="lang-text" data-es="Contraseña:" data-en="Password:">Contraseña:</label>
                        <input type="password" id="pass" required data-placeholder-es="Ingrese contraseña" data-placeholder-en="Enter password" placeholder="Ingrese contraseña">
                    </div>

                    <!-- Mensajes de Error Dinámicos -->
                    <div id="errorMessage" class="error-message"></div>

                    <!-- Botón Ingresar -->
                    <div class="form-actions">
                        <input type="submit" class="lang-text" data-es="Ingresar" data-en="Login" value="Ingresar">
                    </div>
                </form>
            </div>
            <div class="login-footer">
                <p>
                    <a href="registro.html" class="lang-text" data-es="¿No tienes cuenta? Regístrate" data-en="Don't have an account? Sign Up">¿No tienes cuenta? Regístrate</a>
                    <a href="recuperar.html" class="lang-text" data-es="¿Olvidaste tu contraseña?" data-en="Forgot your password?">¿Olvidaste tu contraseña?</a>
                    <a href="index.html" class="lang-text" data-es="Regresar al Inicio" data-en="Return to Home">Regresar al Inicio</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
