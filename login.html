<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPeru - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Nuevo Encabezado Corporativo -->
    <header class="main-header">
        <div class="header-wrap">
            <div class="brand">
                <span class="brand-title-top">TechPeru</span>
                <span class="brand-title">Login</span>
            </div>
            <div class="top-info">
                <div class="utility-buttons">
                    <a href="index.html" class="btn-utility">🌐Volver al inicio</a>  
                </div>
            </div>
        </div>
    </header>

    <!-- Contenedor del Login -->
    <main class="login-wrapper">
        <div class="login-container">
            <header class="login-header">
                <h2>Iniciar Sesión</h2>
            </header>
            
            <section class="login-content">
                <form id="loginForm" action="#">
                    <div class="form-group">
                        <label for="user">Usuario / Correo:</label>
                        <input type="text" id="user" placeholder="ejemplo@correo.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="pass">Contraseña:</label>
                        <input type="password" id="pass" placeholder="Ingresa tu contraseña" required>
                    </div>
                    
                    <div class="form-actions">
                        <input type="submit" value="Ingresar">
                    </div>
                </form>
                <div id="errorMessage" class="error-message"></div>
            </section>
            
            <footer class="login-footer">
                <p>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <a href="#">Regresar al Inicio</a>
                </p>
            </footer>
        </div>
    </main>

    <!-- Vinculación del archivo JavaScript -->
    <script src="js/login.js"></script>
</body>
</html>
