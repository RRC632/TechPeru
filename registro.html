<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechPeru - Registro</title>
    <!-- Usa el mismo archivo CSS del login -->
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

    <!-- CABECERA CON BOTÓN DE IDIOMAS (IGUAL AL LOGIN) -->
    <header class="main-header">
        <div class="header-wrap">
            <div class="brand">
                <a href="index.html" class="brand-link">
                    <span class="brand-title">TechPeru</span>
                    <span class="brand-title-top lang-text" data-es="Registro" data-en="Register Panel">Registro</span>
                </a>
            </div>
            <div class="utility-buttons">
                <a href="index.html" class="btn-utility lang-text" data-es="🌐Volver al inicio" data-en="🌐Back to Home">🌐Volver al inicio</a>
                
                <!-- Menú desplegable de Idiomas -->
                <div class="lang-dropdown">
                    <button id="langBtn" class="btn-utility">🌐 Idioma / Language</button>
                    <div id="langPanel" class="lang-panel">
                        <a href="#" class="lang-option" data-lang="es">Español</a>
                        <a href="#" class="lang-option" data-lang="en">English</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- CUERPO DE REGISTRO -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h2 class="lang-text" data-es="Crear Cuenta" data-en="Create Account">Crear Cuenta</h2>
            </div>
            <div class="login-content">
                <form id="registerForm">
                    <!-- Nombre -->
                    <div class="form-group">
                        <label for="firstName" class="lang-text" data-es="Nombre:" data-en="First Name:">Nombre:</label>
                        <input type="text" id="firstName" required data-placeholder-es="Ingrese su nombre" data-placeholder-en="Enter your first name" placeholder="Ingrese su nombre">
                    </div>

                    <!-- Apellido -->
                    <div class="form-group">
                        <label for="lastName" class="lang-text" data-es="Apellido:" data-en="Last Name:">Apellido:</label>
                        <input type="text" id="lastName" required data-placeholder-es="Ingrese su apellido" data-placeholder-en="Enter your last name" placeholder="Ingrese su apellido">
                    </div>

                    <!-- Correo Gmail -->
                    <div class="form-group">
                        <label for="email" class="lang-text" data-es="Correo (Gmail):" data-en="Email (Gmail):">Correo (Gmail):</label>
                        <input type="email" id="email" required data-placeholder-es="ejemplo@gmail.com" data-placeholder-en="example@gmail.com" placeholder="ejemplo@gmail.com">
                    </div>
                    
                    <!-- Contraseña -->
                    <div class="form-group">
                        <label for="regPass" class="lang-text" data-es="Contraseña:" data-en="Password:">Contraseña:</label>
                        <input type="password" id="regPass" required data-placeholder-es="Ingrese contraseña" data-placeholder-en="Enter password" placeholder="Ingrese contraseña">
                    </div>

                    <!-- Confirmar / Verificador de Contraseña -->
                    <div class="form-group">
                        <label for="confirmPass" class="lang-text" data-es="Confirmar Contraseña:" data-en="Confirm Password:">Confirmar Contraseña:</label>
                        <input type="password" id="confirmPass" required data-placeholder-es="Repita la contraseña" data-placeholder-en="Repeat password" placeholder="Repita la contraseña">
                    </div>

                    <!-- Mensajes de Error Dinámicos -->
                    <div id="errorMessage" class="error-message"></div>

                    <!-- Botón Registrarse -->
                    <div class="form-actions">
                        <input type="submit" class="lang-text" data-es="Registrarse" data-en="Register" value="Registrarse">
                    </div>
                </form>
            </div>
            <div class="login-footer">
                <p>
                    <a href="login.html" class="lang-text" data-es="¿Ya tienes cuenta? Inicia sesión" data-en="Already have an account? Sign In">¿Ya tienes cuenta? Inicia sesión</a>
                    <a href="index.html" class="lang-text" data-es="Regresar al Inicio" data-en="Return to Home">Regresar al Inicio</a>
                </p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/registro.js"></script>
</body>
</html>
